name: 날씨 데이터 업데이트

on:
  schedule:
    - cron: "20 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 관측자료 받기
        continue-on-error: true
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: python fetch_weather.py
      - name: 예보 받기
        continue-on-error: true
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: python fetch_forecast.py
      - name: 저장하기
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in data.json forecast.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --staged --quiet || git commit -m "날씨 데이터 업데이트"
          git push
